name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  cross-os:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/max-agent ./cmd/max-relay ./cmd/max-chat

  race:
    name: Race and security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./... -count=1

  governance:
    name: Skill Workflow STRICT
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Checkout pinned Skill_Workflow
        shell: bash
        run: |
          git clone https://github.com/maxqstudio/Skill_Workflow.git "$RUNNER_TEMP/Skill_Workflow"
          git -C "$RUNNER_TEMP/Skill_Workflow" checkout 024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8
      - name: Verify vendored Skill_Workflow tools
        shell: bash
        run: |
          for name in \
            extract_project_facts.py \
            generate_module_map.py \
            generate_project_docs.py \
            generate_sequence_plan.py \
            generate_symbol_index.py \
            project_profile.py \
            selftest_strict_project_workflow.py \
            sequence_contract.py \
            sync_project_truth.py \
            validate_cross_document_consistency.py \
            validate_doc_quality.py \
            validate_handoff.py \
            validate_human_comprehension.py \
            validate_project_docs.py \
            validate_project_truth.py \
            validate_sequence_contract.py \
            validate_sequence_sessions.py
          do
            cmp ".workflow/tools/$name" "$RUNNER_TEMP/Skill_Workflow/scripts/$name"
          done
          grep -Fq "Compatible with Skill_Workflow 024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8." .workflow/tools/generate_sequence_actual.py

      - name: Self-test Go and TypeScript sequence extractor
        shell: bash
        run: python .workflow/tools/selftest_go_ts_sequence.py

      - name: Generate deterministic Project Truth docs
        shell: bash
        run: python .workflow/tools/sync_project_truth.py --root "$GITHUB_WORKSPACE"
      - name: Generate frozen P7 sequence plan diagram
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_plan.py \
            --plan docs/sequence/plans/p7-cloudflare.plan.json \
            --output docs/sequence/generated/p7-cloudflare.plan.mmd

      - name: Verify P7 plan freeze lineage
        shell: bash
        run: |
          test "$(git show 6dee01f3c1f28db250b9ee67adf42aa2cbe714a0:docs/sequence/plans/p7-cloudflare.plan.json | sha256sum | awk '{print $1}')" = "e74de93187544f2044185f2f3c25edfc7d5f6d4eb790d9f21f9801638223a680"

      - name: Generate P7 actual sequence evidence
        if: hashFiles('cloudflare/relay/src/index.ts') != ''
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root "$GITHUB_WORKSPACE" \
            --output-json docs/sequence/generated/p7-cloudflare.actual.json \
            --output-mermaid docs/sequence/generated/p7-cloudflare.actual.mmd \
            --entry "cloudflare/relay/src/index.ts::fetch"

      - name: Validate P7 sequence contract
        if: hashFiles('cloudflare/relay/src/index.ts') != ''
        shell: bash
        run: python .workflow/tools/validate_sequence_contract.py --root "$GITHUB_WORKSPACE" --session docs/sequence/p7.session.json
      - name: Generate Go-aware DURING actual sequence evidence
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root "$GITHUB_WORKSPACE" \
            --output-json docs/sequence/generated/p6.actual.json \
            --output-mermaid docs/sequence/generated/p6.actual.mmd \
            --entry "internal/relay/stream.go::HTTPServer.deviceStream" \
            --entry "internal/relay/stream.go::HTTPServer.writeDeviceCommands" \
            --entry "internal/agent/ws_transport.go::WebSocketTransport.NextCommand" \
            --entry "internal/agent/ws_transport.go::WebSocketTransport.connection" \
            --entry "internal/agent/runner.go::Runner.Run" \
            --entry "internal/relay/store.go::Store.NextCommand" \
            --entry "internal/relay/store.go::Store.SubmitResult"
      - name: Validate sequence contract
        shell: bash
        run: python .workflow/tools/validate_sequence_contract.py --root "$GITHUB_WORKSPACE" --session docs/sequence/p6.session.json
      - name: Validate generated docs
        shell: bash
        run: python .workflow/tools/validate_project_docs.py --root "$GITHUB_WORKSPACE"
      - name: Sync deterministic generated truth on P7 v2 work branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/p7-cloudflare-relay-v2'
        shell: bash
        run: |
          git add .workflow/acceptance.json .workflow/generated/code_facts.json docs/*.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate P7 project truth"
            git push origin HEAD:work/p7-cloudflare-relay-v2
          fi
      - name: Verify tracked governance state is deterministic
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignored=no)"
