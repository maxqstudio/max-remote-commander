name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  cross-os:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/max-agent ./cmd/max-relay ./cmd/max-chat ./cmd/max-connect

  race:
    name: Race and security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./... -count=1

  governance:
    name: Skill Workflow STRICT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Checkout pinned Skill_Workflow
        shell: bash
        run: |
          git clone https://github.com/maxqstudio/Skill_Workflow.git "$RUNNER_TEMP/Skill_Workflow"
          git -C "$RUNNER_TEMP/Skill_Workflow" checkout 024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8
      - name: Verify vendored Skill_Workflow tools
        shell: bash
        run: |
          for name in \
            extract_project_facts.py \
            generate_module_map.py \
            generate_project_docs.py \
            generate_sequence_plan.py \
            generate_symbol_index.py \
            project_profile.py \
            selftest_strict_project_workflow.py \
            sequence_contract.py \
            sync_project_truth.py \
            validate_cross_document_consistency.py \
            validate_doc_quality.py \
            validate_handoff.py \
            validate_human_comprehension.py \
            validate_project_docs.py \
            validate_project_truth.py \
            validate_sequence_contract.py \
            validate_sequence_sessions.py
          do
            cmp ".workflow/tools/$name" "$RUNNER_TEMP/Skill_Workflow/scripts/$name"
          done
          grep -Fq "Compatible with Skill_Workflow 024e2ea458b25ad9dfb401d3fdeaa994a4cbe1b8." .workflow/tools/generate_sequence_actual.py

      - name: Generate deterministic Project Truth docs
        shell: bash
        run: python .workflow/tools/sync_project_truth.py --root "$GITHUB_WORKSPACE"
      - name: Generate Go-aware DURING actual sequence evidence
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root "$GITHUB_WORKSPACE" \
            --output-json docs/sequence/generated/p6.actual.json \
            --output-mermaid docs/sequence/generated/p6.actual.mmd \
            --entry "internal/relay/stream.go::HTTPServer.deviceStream" \
            --entry "internal/relay/stream.go::HTTPServer.writeDeviceCommands" \
            --entry "internal/agent/ws_transport.go::WebSocketTransport.NextCommand" \
            --entry "internal/agent/ws_transport.go::WebSocketTransport.connection" \
            --entry "internal/agent/runner.go::Runner.Run" \
            --entry "internal/relay/store.go::Store.NextCommand" \
            --entry "internal/relay/store.go::Store.SubmitResult"
      - name: Validate sequence contract
        shell: bash
        run: python .workflow/tools/validate_sequence_contract.py --root "$GITHUB_WORKSPACE" --session docs/sequence/p6.session.json
      - name: Validate generated docs
        shell: bash
        run: python .workflow/tools/validate_project_docs.py --root "$GITHUB_WORKSPACE"
      - name: Verify tracked governance state is deterministic
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignored=no)"

  ssh-loopback:
    name: SSH/SFTP loopback smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Start isolated SSH server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/ci_ed25519"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat "$RUNNER_TEMP/ci_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1 -o PasswordAuthentication=no -o PubkeyAuthentication=yes -o PermitRootLogin=no -o UsePAM=no
          ssh-keyscan -p 2222 127.0.0.1 > "$RUNNER_TEMP/ci_known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/ci_known_hosts"
      - name: Verify SSH, SFTP and reject an unknown host key
        shell: bash
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/max-connect" ./cmd/max-connect
          common=(--host 127.0.0.1 --user "$(id -un)" --port 2222 --identity "$RUNNER_TEMP/ci_ed25519" --known-hosts "$RUNNER_TEMP/ci_known_hosts")
          "$RUNNER_TEMP/max-connect" check "${common[@]}"
          printf 'pwd\nbye\n' | "$RUNNER_TEMP/max-connect" files "${common[@]}"
          : > "$RUNNER_TEMP/empty_known_hosts"
          if "$RUNNER_TEMP/max-connect" check --host 127.0.0.1 --user "$(id -un)" --port 2222 --identity "$RUNNER_TEMP/ci_ed25519" --known-hosts "$RUNNER_TEMP/empty_known_hosts"; then
            echo "FAIL: unknown host key was accepted"
            exit 1
          fi
