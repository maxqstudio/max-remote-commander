name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  cross-os:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/max-agent ./cmd/max-relay ./cmd/max-chat

  race:
    name: Race and security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./... -count=1

  governance:
    name: Skill Workflow STRICT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Checkout pinned Skill_Workflow
        shell: bash
        run: |
          git clone https://github.com/maxqstudio/Skill_Workflow.git "$RUNNER_TEMP/Skill_Workflow"
          git -C "$RUNNER_TEMP/Skill_Workflow" checkout 2148313678f476c4990e447b4d657724f071adff
      - name: Generate deterministic Project Truth docs
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/sync_project_truth.py" --root "$GITHUB_WORKSPACE"
      - name: Generate Go-aware DURING actual sequence evidence
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root "$GITHUB_WORKSPACE" \
            --output-json docs/sequence/generated/phase-5a.actual.json \
            --output-mermaid docs/sequence/generated/phase-5a.actual.mmd \
            --entry "cmd/max-relay/main.go::durableStateConfig" \
            --entry "internal/relay/persistence.go::stateFile.Load" \
            --entry "internal/relay/persistence.go::stateFile.Save" \
            --entry "internal/relay/pairing.go::Store.RedeemPairing" \
            --entry "internal/relay/command_auth.go::Store.QueuePairedCommand" \
            --entry "internal/relay/store.go::Store.SubmitResult" \
            --entry "internal/relay/pairing.go::Store.RevokePairing"
      - name: Validate sequence contract
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/validate_sequence_contract.py" --root "$GITHUB_WORKSPACE" --session docs/sequence/phase-5a.session.json
      - name: Validate generated docs
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/validate_project_docs.py" --root "$GITHUB_WORKSPACE"
      - name: Verify tracked governance state is deterministic
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignored=no)"
