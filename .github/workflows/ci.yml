name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: write

jobs:
  cross-os:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build agent
        run: go build ./cmd/max-agent

  race:
    name: Race and security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./... -count=1

  governance:
    name: Skill Workflow STRICT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout pinned Skill_Workflow
        shell: bash
        run: |
          git clone https://github.com/maxqstudio/Skill_Workflow.git "$RUNNER_TEMP/Skill_Workflow"
          git -C "$RUNNER_TEMP/Skill_Workflow" checkout 9e22feddb8f94e8c0f1af6a33e14b64de5068f8f
      - name: Generate deterministic Project Truth docs
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/sync_project_truth.py" --root "$GITHUB_WORKSPACE"
      - name: Generate DURING actual sequence evidence
        shell: bash
        run: |
          python "$RUNNER_TEMP/Skill_Workflow/scripts/generate_sequence_actual.py" \
            --root "$GITHUB_WORKSPACE" \
            --output-json docs/sequence/generated/phase-0.actual.json \
            --output-mermaid docs/sequence/generated/phase-0.actual.mmd
      - name: Validate sequence contract
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/validate_sequence_contract.py" --root "$GITHUB_WORKSPACE" --session docs/sequence/phase-0.session.json
      - name: Validate generated docs
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/validate_project_docs.py" --root "$GITHUB_WORKSPACE"
      - name: Commit deterministic governance outputs on work branch
        if: github.event_name == 'push' && startsWith(github.ref_name, 'work/')
        shell: bash
        run: |
          git add .workflow/acceptance.json .workflow/generated docs artifacts/sequence || true
          if git diff --cached --quiet; then
            echo "No generated governance changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync governed project truth"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Generated state is clean after sync
        shell: bash
        run: git diff --exit-code
