name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

permissions:
  contents: read

jobs:
  cross-os:
    name: Go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/max-agent ./cmd/max-relay ./cmd/max-chat

  race:
    name: Race and security regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./... -count=1

  governance:
    name: Skill Workflow STRICT
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Checkout pinned Skill_Workflow
        shell: bash
        run: |
          git clone https://github.com/maxqstudio/Skill_Workflow.git "$RUNNER_TEMP/Skill_Workflow"
          git -C "$RUNNER_TEMP/Skill_Workflow" checkout 9e22feddb8f94e8c0f1af6a33e14b64de5068f8f
      - name: Generate deterministic Project Truth docs
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/sync_project_truth.py" --root "$GITHUB_WORKSPACE"
      - name: Generate Go-aware DURING actual sequence evidence
        shell: bash
        run: |
          python .workflow/tools/generate_sequence_actual.py \
            --root "$GITHUB_WORKSPACE" \
            --output-json docs/sequence/generated/phase-4.actual.json \
            --output-mermaid docs/sequence/generated/phase-4.actual.mmd \
            --entry "cmd/max-chat/main.go::runREPL" \
            --entry "internal/chat/chat.go::Session.Run" \
            --entry "internal/controller/executor.go::RemoteExecutor.Execute" \
            --entry "internal/controller/client.go::Client.QueueTool" \
            --entry "internal/agent/runner.go::Runner.Run" \
            --entry "internal/agent/runner.go::Runner.handleCommand" \
            --entry "internal/providers/openaicompat/provider.go::Provider.Complete"
      - name: Validate sequence contract
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/validate_sequence_contract.py" --root "$GITHUB_WORKSPACE" --session docs/sequence/phase-4.session.json
      - name: Validate generated docs
        shell: bash
        run: python "$RUNNER_TEMP/Skill_Workflow/scripts/validate_project_docs.py" --root "$GITHUB_WORKSPACE"
      - name: Sync deterministic generated truth on Phase 4 work branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/phase-4-agent-chat'
        shell: bash
        run: |
          git add .workflow/generated/code_facts.json docs/*.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate Phase 4 project truth"
            git push origin HEAD:work/phase-4-agent-chat
          fi
      - name: Verify tracked governance state is deterministic
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all --ignored=no)"

      - name: Upload deterministic governance snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-4-governance-snapshot
          if-no-files-found: error
          path: |
            .workflow/generated/
            docs/
            artifacts/sequence/
